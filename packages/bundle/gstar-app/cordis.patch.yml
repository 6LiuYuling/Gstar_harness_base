# GSTAR presentation overlay. Host transport, storage, Workspace, Client
# runtime, theme, locale, and renderer continue to come from dsh-web-app.

- insert:
    # Fixed-origin Host retrieval for station-name geocoding. The model-facing
    # web_fetch tool remains disabled; only gstarSpatial constructs the URL.
    - id: gstar-web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
      config:
        maxUrlLength: 8192
        maxResponseBytes: 20000000
        maxBodyChars: 12000000
        timeoutMs: 150000
        maxRedirects: 1
        userAgent: 'GSTAR-Harness/0.1 (+https://github.com/6LiuYuling/Gstar_harness_base)'

    # Workspace remains the durable station authority. This GSTAR provider
    # publishes the station-shaped Host and Remote capability over it.
    - id: gstar-sites
      name: '@deepseek-ai/dsh-gstar-site-workspace'

    # Spatial snapshots stay in a Host capability so Cesium only projects
    # station locations, AOIs, entities, and provenance returned by DSH.
    - id: gstar-spatial
      name: '@deepseek-ai/dsh-gstar-spatial-storage'
      config:
        overpassEndpoint: 'https://overpass-api.de/api/interpreter'
        overpassTimeoutSeconds: 120
        overpassMaxElements: 2000
        overpassRequestIntervalMilliseconds: 1000
        overpassRetryDelayMilliseconds: 30000
        overpassMaxRetries: 2
        fallbackRadiusMeters: 15000

    # Read-only Agent Consumer: scopes station/AOI/entity/provenance queries
    # from the calling Session cwd and rejects non-station Workspaces.
    - id: gstar-tool-spatial-query
      name: '@deepseek-ai/dsh-gstar-tool-spatial-query'

    # Cesium's workers, widgets, and runtime assets are served by the DSH Web
    # Server. The GSTAR browser plugin is not a separately hosted web app.
    - id: gstar-cesium-assets
      name: '@deepseek-ai/dsh-gstar-cesium-assets'

    # Browser-only Remote contribution: mounts `gstarSites` and `gstarSpatial`
    # into the DSH Client carrier without adding GSTAR namespaces to `dsh web`.
    - id: gstar-client-remotes
      name: '@deepseek-ai/dsh-gstar-client-remotes'

    # GSTAR is a separate Client row rather than a `name` override. In the
    # include patch dialect `name` validates the package already mounted at an
    # id; it does not replace that package.
    - id: ui-gstar
      name: '@deepseek-ai/dsh-client-ui-gstar'

- id: ui-layout
  disabled: true

# GSTAR owns the root and the station list, so the standard shell and generic
# Workspace presentation stay disabled. The standard conversation subtree is
# intentionally active and mounts into GSTAR's right-hand `conversation` slot.
- id: ui-sidebar
  disabled: true
# `ui-settings` is the presentation-free settings domain. It must remain
# active because it provides `settingsScope` to locale and theme. Only its
# standard settings-page consumers below are disabled for the GSTAR shell.
- id: ui-settings-general
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
# The GSTAR root re-declares ui-workspace's directory-flow holes so the
# shared directory-picker-auto interaction remains available without the
# standard Workspace list or generic Workspace adoption action.
- id: ui-workspace
  disabled: true
- id: ui-settings-plugins
  disabled: true
